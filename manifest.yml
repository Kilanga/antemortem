modules:
  # ---------------------------------------------------------------------------
  # UI — Command center (Custom UI, React + Vite)
  # ---------------------------------------------------------------------------
  jira:globalPage:
    - key: antemortem-command-center
      resource: command-center
      resolver:
        function: resolver
      title: Antemortem
      layout: native

  # ---------------------------------------------------------------------------
  # Lifecycle — schema is applied at install time, and re-checked hourly
  # ---------------------------------------------------------------------------
  trigger:
    - key: antemortem-on-install
      function: on-install
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app

  scheduledTrigger:
    - key: antemortem-hourly
      function: hourly
      interval: hour

  # "Run analysis now" — also used by the demo and by tests.
  webtrigger:
    - key: antemortem-run-analysis
      function: run-analysis-webtrigger

  # ---------------------------------------------------------------------------
  # Storage
  # ---------------------------------------------------------------------------
  sql:
    - key: main
      engine: mysql

  # ---------------------------------------------------------------------------
  # Functions
  # ---------------------------------------------------------------------------
  function:
    - key: resolver
      handler: index.resolver
    - key: on-install
      handler: index.onInstall
    - key: hourly
      handler: index.hourly
      timeoutSeconds: 55
    - key: run-analysis-webtrigger
      handler: index.runAnalysisWebtrigger

resources:
  - key: command-center
    path: static/command-center/dist

permissions:
  scopes:
    - storage:app
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - read:confluence-content.all
    - write:confluence-content
    - read:confluence-space.summary

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/29a1ae10-bc1f-4027-a192-00aa16fa9d20
