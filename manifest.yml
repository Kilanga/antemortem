modules:
  # ---------------------------------------------------------------------------
  # UI — Command center (Custom UI, React + Vite)
  # ---------------------------------------------------------------------------
  jira:globalPage:
    - key: antemortem-command-center
      resource: command-center
      resolver:
        function: resolver
      title: Antemortem
      layout: native

  # On every issue: which obligations it feeds, which assumptions mention it,
  # whether it appears in a projected post-mortem.
  macro:
    - key: antemortem-macro
      resource: macro
      resolver:
        function: resolver
      render: native
      title: Antemortem — projected incidents
      description: The post-mortems Antemortem has written for incidents that have not happened yet.
      layout: block
  jira:dashboardGadget:
    - key: antemortem-gadget
      resource: gadget
      resolver:
        function: resolver
      render: native
      title: Antemortem — next post-mortem
      description: The next projected incident, the obligations at risk and the penalties exposed.
      thumbnail: https://raw.githubusercontent.com/Kilanga/antemortem/main/assets/gadget.png
  jira:issueContext:
    - key: antemortem-issue-context
      resource: issue-context
      resolver:
        function: resolver
      render: native
      title: Antemortem
      label: Antemortem
      description: Obligations, decisions and projected incidents linked to this issue.

  # ---------------------------------------------------------------------------
  # Rovo — the agent and the actions (also usable as tools by other agents)
  # ---------------------------------------------------------------------------
  rovo:agent:
    - key: antemortem-agent
      name: Antemortem
      description: Tells you which post-mortem you will be writing next, why, and what would prevent it.
      prompt: resource:agent-resource;prompt.txt
      conversationStarters:
        - What is my next post-mortem?
        - Why is O-3 at risk?
        - How are our obligations doing?
        - What are the corrective actions right now?
        - Record the decision from this page and what it rests on
        - Record the obligations from this contract page
      actions:
        - get-next-incident
        - explain-obligation
        - list-obligation-status
        - list-corrective-actions
        - record-decision
        - read-page-for-decision
        - record-obligation
  action:
    - key: read-page-for-decision
      name: Read a Confluence page to propose decisions or obligations
      function: rovo-read-page
      actionVerb: GET
      description: >-
        Reads a Confluence page (minutes, a contract, an SLA annex) and returns its text with the references
        needed to record decisions or obligations. Propose first; record only after the user confirms.
      inputs:
        page:
          title: Page
          type: string
          required: true
          description: The Confluence page URL or id.
    - key: get-next-incident
      name: Get next projected incident
      function: rovo-next-incident
      actionVerb: GET
      description: >
        Returns the next projected incident (a post-mortem written before the incident):
        date, probability, projected cost, corrective actions and the page link.
        Use for "what is my next post-mortem", "what's coming", "any incident ahead".
      inputs: {}
    - key: explain-obligation
      name: Explain why an obligation is at risk
      function: rovo-explain-obligation
      actionVerb: GET
      description: >
        For one contractual obligation (by code, e.g. O-3), returns the forecast, the
        signals, the decisions it depends on and their assumptions, and how the probability was computed.
      inputs:
        obligationCode:
          title: Obligation code
          type: string
          required: true
          description: The obligation code, such as O-3.
    - key: list-obligation-status
      name: List obligations and their breach probability
      function: rovo-list-obligations
      actionVerb: GET
      description: Returns every active obligation with its latest breach probability, projected date and cost.
      inputs: {}
    - key: list-corrective-actions
      name: List corrective actions
      function: rovo-list-actions
      actionVerb: GET
      description: Returns the corrective actions (Jira issues) of open projected incidents and their status. Optionally filtered by obligation code.
      inputs:
        obligationCode:
          title: Obligation code
          type: string
          required: false
          description: Optional obligation code to filter on, such as O-3.
    - key: record-decision
      name: Record a decision
      function: rovo-record-decision
      actionVerb: CREATE
      description: >
        Records a decision and the assumptions it rests on, so Antemortem can watch them.
        Use when the user states that something was decided.
      inputs:
        title:
          title: Title
          type: string
          required: true
          description: Short title of the decision.
        statement:
          title: What was decided
          type: string
          required: true
          description: The decision, in one or two sentences.
        rationale:
          title: Why
          type: string
          required: false
          description: The reasoning behind the decision.
        assumptions:
          title: Assumptions
          type: string
          required: false
          description: >
            One assumption per line. A typed line reads "statement :: kind :: key=value, key=value"
            (kinds: capacity, person_available, dependency_done_by, routing); a bare line is free text.
        sourceUrl:
          title: Source URL
          type: string
          required: false
          description: The Confluence page the decision comes from.
        decidedAt:
          title: Decided on
          type: string
          required: false
          description: ISO date the decision was taken.
        obligationCode:
          title: Obligation code
          type: string
          required: false
          description: Obligation this decision supports, such as O-3.
    - key: record-obligation
      name: Record a contractual obligation
      function: rovo-record-obligation
      actionVerb: CREATE
      description: >-
        Records one measurable contractual obligation (SLA ratio, count cap or floor, deliverable deadline)
        with its period, penalty and JQL scope. Call once per obligation, only after the user confirmed the proposal.
      inputs:
        contractName:
          title: Contract name
          type: string
          required: true
          description: Name of the contract (created if new). Append the counterparty after " — " if known.
        code:
          title: Code
          type: string
          required: true
          description: Short code, such as O-5.
        title:
          title: Title
          type: string
          required: true
          description: The clause in one line, e.g. "Restoration ≤ 4 h on 95 % of lot 3 interventions".
        metricType:
          title: Metric type
          type: string
          required: true
          description: ratio_within_sla (dates), jsm_sla (a Jira Service Management SLA field), count_max, count_min or deadline.
        slaHours:
          title: SLA hours
          type: number
          required: false
          description: For ratio_within_sla or jsm_sla, the time limit / goal in hours.
        slaName:
          title: SLA name
          type: string
          required: false
          description: For jsm_sla, the JSM SLA field name, e.g. Time to resolution.
        threshold:
          title: Threshold
          type: number
          required: false
          description: Ratio 0–1 (or percent) for ratio_within_sla / jsm_sla; the count for count_max / count_min.
        period:
          title: Period
          type: string
          required: false
          description: >-
            monthly (default), weekly, one_shot, or "custom YYYY-MM-DD YYYY-MM-DD" with the window's start and end dates.
        penalty:
          title: Penalty
          type: string
          required: false
          description: >-
            "fixed <amount>" (e.g. "fixed 5000"), or "percent <value> of <invoice basis>" (e.g. "percent 2 of 2000000").
        jqlScope:
          title: JQL scope
          type: string
          required: false
          description: The issues that feed the measure, e.g. project = "NFS" AND labels = lot-3 AND labels = intervention.

  # ---------------------------------------------------------------------------
  # Lifecycle — schema is applied at install time, and re-checked hourly
  # ---------------------------------------------------------------------------
  trigger:
    - key: antemortem-on-install
      function: on-install
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app

  scheduledTrigger:
    - key: antemortem-hourly
      function: hourly
      interval: hour

  # "Run analysis now" — also used by the demo and by tests.
  webtrigger:
    - key: antemortem-run-analysis
      function: run-analysis-webtrigger

  # Long-running jobs (demo load/reset) run as async events: up to 15 min.
  consumer:
    - key: antemortem-jobs-consumer
      queue: antemortem-jobs
      function: jobs

  # ---------------------------------------------------------------------------
  # Storage
  # ---------------------------------------------------------------------------
  sql:
    - key: main
      engine: mysql

  # ---------------------------------------------------------------------------
  # Functions
  # ---------------------------------------------------------------------------
  function:
    - key: resolver
      handler: index.resolver
    - key: on-install
      handler: index.onInstall
    - key: hourly
      handler: index.hourly
      timeoutSeconds: 55
    - key: run-analysis-webtrigger
      handler: index.runAnalysisWebtrigger
    - key: jobs
      handler: index.jobsConsumer
      timeoutSeconds: 900
    - key: rovo-next-incident
      handler: index.getNextIncident
    - key: rovo-explain-obligation
      handler: index.explainObligation
    - key: rovo-list-obligations
      handler: index.listObligationStatus
    - key: rovo-list-actions
      handler: index.listCorrectiveActions
    - key: rovo-record-decision
      handler: index.recordDecision
    - key: rovo-read-page
      handler: index.readPageForDecision
    - key: rovo-record-obligation
      handler: index.recordObligation

resources:
  - key: command-center
    path: static/command-center/dist
  - key: issue-context
    path: src/frontend/issue-context.jsx
  - key: macro
    path: src/frontend/macro.jsx
  - key: gadget
    path: src/frontend/gadget.jsx
  - key: agent-resource
    path: resource/agent

permissions:
  scopes:
    - storage:app
    # Jira — reading the work graph, creating corrective actions, and (demo
    # loader only) creating/deleting the NFS project.
    - read:jira-work
    - write:jira-work
    - manage:jira-configuration
    # Confluence — publishing projected incidents (v2 pages API, granular)
    # and (demo loader only) creating/deleting the ANTE space (v1, classic).
    - read:space:confluence
    - read:page:confluence
    - write:page:confluence
    - write:confluence-space
    # Rovo — lets customer-built agents call our actions as tools.
    - read:chat:rovo

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/29a1ae10-bc1f-4027-a192-00aa16fa9d20
